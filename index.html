<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>일본어 단어장</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f31;--panel2:#1b2940;--muted:#91a2bb;--line:#26364e;--accent:#9bdcff;--green:#9be3bb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182a43 0,#0b1220 55%);color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 17px;background:rgba(12,21,36,.94);position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(145,162,187,.14);backdrop-filter:blur(18px)}
h1{font-size:21px;letter-spacing:-.5px;margin:0 0 4px;font-weight:800}.sub{font-size:11px;color:var(--muted)}
main{max-width:620px;margin:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:2px 0 13px}
.stat,.card,.tools{background:linear-gradient(145deg,#19263a,#121d2e);border:1px solid rgba(145,162,187,.13);border-radius:19px;padding:14px;box-shadow:0 8px 28px #0002}
.stat b{display:block;font-size:22px;letter-spacing:-.5px}.stat span{font-size:10px;color:var(--muted)}
.progress{height:6px;background:#25354b;border-radius:20px;overflow:hidden;margin:11px 2px 17px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#79c9ff,#9be3bb);width:0;border-radius:20px;transition:width .25s}
.tabs{display:flex;gap:7px;overflow-x:auto;margin:13px 0 17px;padding:2px 0 5px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.btn{border:1px solid var(--line);background:#1a2940;color:#dce8f7;border-radius:12px;padding:11px 14px;font-weight:700;white-space:nowrap;font-size:13px}
.tabs button.active,.btn.primary{background:var(--accent);color:#0b1a2b;border-color:var(--accent)}
input,select{width:100%;padding:14px;border-radius:13px;background:#111d30;border:1px solid var(--line);color:white;font-size:15px}
.card{margin-top:8px;text-align:center;padding:30px 18px 24px;min-height:340px;display:flex;flex-direction:column;justify-content:center}
.level{font-size:11px;color:var(--accent);font-weight:750;letter-spacing:1px;text-transform:uppercase}
.word{font-size:clamp(42px,11vw,56px);font-weight:850;letter-spacing:1px;margin:20px 0}
.reading{color:var(--muted);font-size:16px}.meaning{font-size:21px;font-weight:750;margin:17px 0}
.example{font-size:16px;line-height:1.8;margin-top:20px;padding-top:17px;border-top:1px solid var(--line)}
.translation{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}.actions .btn{flex:1;min-width:calc(50% - 8px);padding:13px 10px}
.small{font-size:12px;color:var(--muted);line-height:1.7}.hidden{display:none}
.list{display:grid;gap:9px;margin-top:13px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);padding:13px;border-radius:14px;border:1px solid rgba(145,162,187,.13)}
.item strong{font-size:18px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
footer{text-align:center;padding:24px 10px;color:var(--muted);font-size:10px;line-height:1.6}
button{cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}
@media(min-width:600px){main{padding-top:24px}.card{min-height:390px}}
</style></head><body><header><h1>일본어 단어장 🇯🇵</h1><div class="sub">하루 20개 · JLPT N5–N1 · JPT · 반도체/장비 업무</div></header><main>
<div class="stats"><div class="stat"><b id="todayCount">0/20</b><span>오늘 학습</span></div><div class="stat"><b id="knownCount">0</b><span>외운 단어</span></div><div class="stat"><b id="reviewCount">0</b><span>복습 단어</span></div></div>
<div class="progress"><i id="bar"></i></div><div class="tabs" id="tabs"><button class="active" data-tab="daily">오늘의 20개</button><button data-tab="jlpt">JLPT</button><button data-tab="work">업무/반도체</button><button data-tab="review">복습</button><button data-tab="search">검색</button></div>
<section id="daily"><div class="small" id="loadStatus">단어 데이터를 불러오는 중… 처음 실행할 때 인터넷 연결이 필요해.</div><div class="card"><div class="level" id="level">오늘의 단어</div><div class="word" id="word">読み込み中</div><div class="reading hidden" id="reading"></div><div class="meaning hidden" id="meaning"></div><div class="example hidden" id="example"></div><div class="translation hidden" id="translation"></div><div class="actions"><button class="btn primary" id="reveal">뜻/읽기 보기</button><button class="btn" id="known">외웠어</button><button class="btn" id="again">다시 보기</button><button class="btn" id="next">다음 단어 →</button></div></div></section>
<section id="jlpt" class="hidden"><div class="tabs" id="levels"><button data-level="N5">N5</button><button data-level="N4">N4</button><button data-level="N3">N3</button><button data-level="N2">N2</button><button data-level="N1">N1</button></div><div class="list" id="jlptList"></div></section>
<section id="work" class="hidden"><div class="small">반도체 제조·설비·포토·CVD·현장 대응에서 자주 쓰는 업무 어휘</div><div class="list" id="workList"></div></section>
<section id="review" class="hidden"><div class="small">다시 보기로 표시한 단어와 아직 헷갈리는 단어</div><div class="list" id="reviewList"></div></section>
<section id="search" class="hidden"><input id="query" placeholder="한자 / 히라가나 / 한국어로 검색"><div class="list" id="searchList"></div></section>
<footer>JLPT 어휘 데이터: OpenJLPT (CC BY-SA 4.0). JLPT 등급은 공식 출제 목록이 아닌 공개 커뮤니티 기준 참고치야.</footer>
</main>
<script>
const $=id=>document.getElementById(id);let vocab=[],daily=[],pos=0,level="N5",currentWord=null;const state=JSON.parse(localStorage.getItem("jpstate")||'{"known":[],"review":[],"done":[]}');state.dailyDate=state.dailyDate||"";state.dailyIds=state.dailyIds||[];state.dailyDone=state.dailyDone||[];
const work=[
["露光","ろこう","노광","露光条件を確認してください。","노광 조건을 확인해 주세요."],["塗布","とふ","도포","レジストを均一に塗布します。","레지스트를 균일하게 도포합니다."],["現像","げんぞう","현상","現像時間を調整します。","현상 시간을 조정합니다."],["洗浄","せんじょう","세정","ウエハを洗浄してください。","웨이퍼를 세정해 주세요."],["成膜","せいまく","박막 형성·증착","成膜工程に異常があります。","증착 공정에 이상이 있습니다."],["エッチング","えっちんぐ","식각","エッチングレートを測定します。","식각률을 측정합니다."],["膜厚","まくあつ","막 두께","膜厚にばらつきがあります。","막 두께에 편차가 있습니다."],["歩留まり","ぶどまり","수율","歩留まりが低下しています。","수율이 저하되고 있습니다."],["装置","そうち","장비·설비","装置を停止してください。","장비를 정지해 주세요."],["点検","てんけん","점검","定期点検を実施します。","정기 점검을 실시합니다."],["保全","ほぜん","보전·유지보수","予防保全が必要です。","예방 보전이 필요합니다."],["故障","こしょう","고장","装置が故障しました。","장비가 고장 났습니다."],["復旧","ふっきゅう","복구","装置の復旧を急いでいます。","장비 복구를 서두르고 있습니다."],["交換","こうかん","교체","部品を交換してください。","부품을 교체해 주세요."],["調整","ちょうせい","조정","位置を微調整します。","위치를 미세 조정합니다."],["原因","げんいん","원인","不具合の原因を調査します。","불량의 원인을 조사합니다."],["再発","さいはつ","재발","同じ問題が再発しました。","같은 문제가 재발했습니다."],["確認","かくにん","확인","設定値を確認してください。","설정값을 확인해 주세요."],["測定","そくてい","측정","圧力を測定します。","압력을 측정합니다."],["圧力","あつりょく","압력","チャンバー内の圧力を確認します。","챔버 내부 압력을 확인합니다."],["真空","しんくう","진공","真空状態になりません。","진공 상태가 되지 않습니다."],["漏れ","もれ","누설","ガス漏れを検知しました。","가스 누설을 감지했습니다."],["流量","りゅうりょう","유량","ガス流量を調整します。","가스 유량을 조정합니다."],["温度","おんど","온도","温度が設定値を超えています。","온도가 설정값을 초과했습니다."],["異常","いじょう","이상","異常が発生したため停止しました。","이상이 발생해 정지했습니다."],["改善","かいぜん","개선","再発防止策を改善します。","재발 방지 대책을 개선합니다."],["納期","のうき","납기","部品の納期を確認します。","부품 납기를 확인합니다."],["立ち上げ","たちあげ","셋업·가동 개시","新しい装置の立ち上げを行います。","새 장비 셋업을 진행합니다."],["引き継ぎ","ひきつぎ","인수인계","作業内容を引き継ぎます。","작업 내용을 인수인계합니다."],["再現性","さいげんせい","재현성","測定結果の再現性を確認します。","측정 결과의 재현성을 확인합니다."]].map((x,i)=>({id:"work"+i,word:x[0],reading:x[1],meanings:[x[2]],level:"업무",examples:[{ja:x[3],ko:x[4]}]}));
function save(){state.dailyDone=[...new Set(state.dailyDone)].filter(id=>state.dailyIds.includes(id)).slice(0,20);$("knownCount").textContent=state.known.length;$("reviewCount").textContent=state.review.length;$("todayCount").textContent=Math.min(20,state.dailyDone.length)+"/20";$("bar").style.width=Math.min(100,state.dailyDone.length/20*100)+"%";localStorage.setItem("jpstate",JSON.stringify(state))}
function examples(v){return v.examples?.[0]||{}}
function show(v){if(!v)return;currentWord=v;$("level").textContent=v.level;$("word").textContent=v.word;$("reading").textContent="읽기: "+(v.reading||v.word);$("meaning").textContent=(v.meanings||[]).join(" · ");let ex=examples(v);$("example").textContent=ex.ja||"예문 준비 중";$("translation").textContent=ex.ko||ex.en||"";["reading","meaning","example","translation"].forEach(x=>$(x).classList.add("hidden"));$("reveal").classList.remove("hidden")}
function reveal() {["reading","meaning","example","translation"].forEach(x=>$(x).classList.remove("hidden"));$("reveal").classList.add("hidden")}
function pickDaily(){const today=new Date().toLocaleDateString("sv-SE");if(state.dailyDate!==today){state.dailyDate=today;state.dailyDone=[];state.dailyIds=vocab.filter(v=>!state.known.includes(v.id)).slice(0,20).map(v=>v.id);save()}state.dailyIds=state.dailyIds.slice(0,20);daily=state.dailyIds.map(id=>vocab.find(v=>v.id===id)).filter(Boolean);pos=0;save();if(daily.length)show(daily[pos]);else $("word").textContent="오늘의 새 단어를 모두 학습했어! 🎉"}
function markKnown(v){if(!v)return;if(!state.known.includes(v.id))state.known.push(v.id);if(state.dailyIds.includes(v.id)&&!state.dailyDone.includes(v.id)&&state.dailyDone.length<20)state.dailyDone.push(v.id);state.done=state.known.slice();state.review=state.review.filter(id=>id!==v.id);save();list("reviewList",vocab.filter(x=>state.review.includes(x.id)));}
function list(target,arr){$(target).innerHTML="";arr.slice(0,120).forEach(v=>{let d=document.createElement("div");d.className="item";d.innerHTML='<div><strong></strong><small></small></div><div style="display:flex;gap:6px"><button class="btn">보기</button>'+(target==="reviewList"?'<button class="btn primary">외웠어</button>':"")+'</div>';d.querySelector("strong").textContent=v.word;d.querySelector("small").textContent=(v.reading||"")+" · "+(v.meanings||[]).join(", ");d.querySelectorAll("button")[0].onclick=()=>{show(v);document.querySelector('[data-tab="daily"]').click()};if(target==="reviewList")d.querySelectorAll("button")[1].onclick=()=>markKnown(v);$(target).append(d)})}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["daily","jlpt","work","review","search"].forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab));if(b.dataset.tab==="work")list("workList",work);if(b.dataset.tab==="review")list("reviewList",vocab.filter(v=>state.review.includes(v.id)));});
$("reveal").onclick=reveal;$("known").onclick=()=>{let v=currentWord||daily[pos];markKnown(v);$("next").click()};$("again").onclick=()=>{let v=currentWord||daily[pos];if(v&&!state.review.includes(v.id))state.review.push(v.id);save();list("reviewList",vocab.filter(x=>state.review.includes(x.id)));$("next").click()};$("next").onclick=()=>{pos++;if(pos>=daily.length){$("word").textContent="오늘 학습 완료! 🎉";["reading","meaning","example","translation"].forEach(x=>$(x).classList.add("hidden"));return}show(daily[pos])};
$("levels").onclick=e=>{let l=e.target.dataset.level;if(!l)return;level=l;list("jlptList",vocab.filter(v=>v.level===l))};
$("query").oninput=e=>{let q=e.target.value.toLowerCase();list("searchList",vocab.filter(v=>[v.word,v.reading,...(v.meanings||[])].join(" ").toLowerCase().includes(q)).slice(0,80))};
async function load(){try{for(let l of ["n5","n4","n3","n2","n1"]){let r=await fetch("https://cdn.jsdelivr.net/gh/evanclan/OpenJLPT@main/data/json/vocab/"+l+".json");if(!r.ok)throw Error("단어 데이터 연결 실패");let a=await r.json();vocab.push(...a)}$("loadStatus").textContent="JLPT 단어 "+vocab.length.toLocaleString()+"개를 불러왔어. (뜻은 공개 원본의 영어 뜻이야. 업무 단어는 한국어 뜻/예문 제공)";pickDaily()}catch(e){$("loadStatus").textContent="단어 데이터를 불러오지 못했어. 인터넷 연결 후 새로고침해 줘. 업무/반도체 단어는 아래 탭에서 바로 볼 수 있어.";daily=work.slice(0,20);show(daily[0])}}
save();load();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
